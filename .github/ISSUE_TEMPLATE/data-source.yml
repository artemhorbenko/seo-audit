name: Support a new data source
description: Suggest a tool or connector the audit should read from
labels: ["data-source"]
body:
  - type: input
    id: source
    attributes:
      label: Tool or service
      placeholder: "e.g. Semrush, Bing Webmaster Tools, Screaming Frog export"
    validations:
      required: true
  - type: input
    id: access
    attributes:
      label: How Claude can reach it
      placeholder: "MCP server name/link, API, export file, screenshots"
  - type: textarea
    id: value
    attributes:
      label: What it would add
      description: Which SEO lenses it would make better, and which numbers to read from it.
